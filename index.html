<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="[jouw naam]" />
    <meta name="color-scheme" content="dark light" />

    <title>Inger's Junk Drawer</title>
    <link rel="stylesheet" href="./assets/style/normal.css" />

    <!-- Importeer het webring component, voeg jouw eigen domein toe in data-page -->
    <script
      data-page="[https://voorbeeld.nl]"
      src="https://digitaaltuintje.nl/webring.js"
      defer
    ></script>
  </head>

  <body>
    <header>
      <form>
        <label for="system-mode">
          <input
            type="radio"
            id="system-mode"
            name="color-scheme"
            value="auto"
            checked
          />
          auto
        </label>
        <label for="light-mode">
          <input
            type="radio"
            id="light-mode"
            name="color-scheme"
            value="light"
          />
          Licht
        </label>
        <label for="dark-mode">
          <input type="radio" id="dark-mode" name="color-scheme" value="dark" />
          Donker
        </label>
      </form>
    </header>

    <main>
      <section class="park">
        <div class="zon"></div>

        <div class="wolk wolk-1"></div>
        <div class="wolk wolk-2"></div>

        <div class="title">
          <p>inger's junk drawer</p>
          <h2>overthinking<br /><em>everything</em></h2>
        </div>

        <div class="boom boom-links"></div>
        <div class="boom boom-rechts"></div>

        <div class="bubbel bubbel-1">wat als...</div>
        <div class="bubbel bubbel-2">had ik maar...</div>
        <div class="bubbel bubbel-3">straks...</div>

        <div class="pad"></div>
        <div class="bankje"></div>

        <div class="park-tekst">
          <p>Er zijn veel paden. Je hoeft er nu maar één te kiezen.</p>
          <a href="story.html">begin je wandeling</a>
        </div>
      </section>
    </main>
  </body>
</html>
