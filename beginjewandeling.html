<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="[jouw naam]" />
    <meta name="color-scheme" content="dark light" />

    <title>Inger's Junk Drawer</title>
    <link rel="stylesheet" href="./assets/style/normal.css" />

    <!-- Importeer het webring component, voeg jouw eigen domein toe in data-page -->
    <script
      data-page="[https://voorbeeld.nl]"
      src="https://digitaaltuintje.nl/webring.js"
      defer
    ></script>
  </head>

  <body>
    <header>
      <form>
        <label for="system-mode">
          <input
            type="radio"
            id="system-mode"
            name="color-scheme"
            value="auto"
            checked
          />
          auto
        </label>
        <label for="light-mode">
          <input
            type="radio"
            id="light-mode"
            name="color-scheme"
            value="light"
          />
          Licht
        </label>
        <label for="dark-mode">
          <input type="radio" id="dark-mode" name="color-scheme" value="dark" />
          Donker
        </label>
      </form>
    </header>
    <main>
      <section class="park">
        <span class="zon" aria-hidden="true"></span>
        <span class="maan" aria-hidden="true"></span>
        <div class="bos" aria-hidden="true">
          <span class="boom ver"></span>
          <span class="boom ver den"></span>
          <span class="boom ver den"></span>
          <span class="boom ver"></span>
          <span class="boom ver"></span>
          <span class="boom ver den"></span>
          <span class="boom den"></span>
          <span class="boom"></span>
          <span class="boom"></span>
          <span class="boom den"></span>
          <span class="boom den"></span>
          <span class="boom"></span>
          <span class="boom"></span>
          <span class="boom den"></span>
          <span class="boom"></span>
          <span class="boom den"></span>
        </div>

        <header class="titel">
          <p>inger's junk drawer</p>
          <h1 id="park-titel">overthinking<br /><em>everything</em></h1>
        </header>

        <section class="park-tekst">
          <p>Er zijn veel paden. Je hoeft er nu maar één te kiezen.</p>
          <a href="beginjewandeling.html">begin je wandeling</a>
        </section>
      </section>
    </main>
  </body>
</html>
