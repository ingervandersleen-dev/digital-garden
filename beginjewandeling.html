<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="[jouw naam]" />
    <meta name="color-scheme" content="dark light" />

    <title>Inger's Junk Drawer</title>
    <link rel="stylesheet" href="./assets/style/normal2.css" />

    <!-- Importeer het webring component, voeg jouw eigen domein toe in data-page -->
    <script
      data-page="[https://voorbeeld.nl]"
      src="https://digitaaltuintje.nl/webring.js"
      defer
    ></script>
  </head>

  <body>
    <header>
      <form>
        <label for="system-mode">
          <input
            type="radio"
            id="system-mode"
            name="color-scheme"
            value="auto"
            checked
          />
          auto
        </label>
        <label for="light-mode">
          <input
            type="radio"
            id="light-mode"
            name="color-scheme"
            value="light"
          />
          Licht
        </label>
        <label for="dark-mode">
          <input type="radio" id="dark-mode" name="color-scheme" value="dark" />
          Donker
        </label>
      </form>
    </header>
    <main>
      <section class="park">
        <span class="zon" aria-hidden="true"></span>
        <span class="maan" aria-hidden="true"></span>

        <header class="titel">
          <p>inger's junk drawer</p>
          <h1 id="park-titel">overthinking<br /><em>everything</em></h1>
        </header>

        <article>
        <h2>Books</h2>

        <img
        src="assets/Lightmodewolk.png"
        alt="Een gedachtenwolk"
        />
      </article>

      <article>
        <h2>Music</h2>

        <img
          src="https://picsum.photos/190"
          alt="Een random vierkante afbeelding van 190 pixels"
        />
      </article>

      <article>
        <h2>Mindfullness</h2>

        <img
          src="https://picsum.photos/200"
          alt="Een random afbeelding van 200 pixels"
        />
      </article>

      <article>
        <h2>Activities</h2>

        <img
          src="https://picsum.photos/190"
          alt="Een random vierkant afbeelding van 190 pixels"
        />
      </article>
    </main>

    <footer>
      <nav>
        <button commandfor="cookieModal" command="show-modal">
          <span>Allow cookies?</span>
        </button>
      </nav>
    </footer>
      </section>
    </main>
  </body>
</html>
