<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Inger van der Sleen" />
    <meta name="color-scheme" content="dark light" />

    <title>Inger's Junk Drawer</title>
    <link rel="stylesheet" href="./assets/style/style.css" />

    <!-- Importeer het webring component, voeg jouw eigen domein toe in data-page -->

      data-page="https://voorbeeld.nl"
      src="https://digitaaltuintje.nl/webring.js"
      defer

  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header>
      <details>
        <summary>Kleurmodus</summary>
        <form>
          <fieldset>
            <legend>Kleurmodus</legend>
            <label for="system-mode">
              <input
                type="radio"
                id="system-mode"
                name="color-scheme"
                value="auto"
                checked
              />
              auto
            </label>
            <label for="light-mode">
              <input
                type="radio"
                id="light-mode"
                name="color-scheme"
                value="light"
              />
              Licht
            </label>
            <label for="dark-mode">
              <input
                type="radio"
                id="dark-mode"
                name="color-scheme"
                value="dark"
              />
              Donker
            </label>
          </fieldset>
        </form>
      </details>
    </header>

    <main id="main-content" tabindex="-1">
      <section class="park">
        <span class="zon" aria-hidden="true"></span>
        <span class="maan" aria-hidden="true"></span>

        <header class="titel">
          <p>inger's junk drawer</p>
          <h1 id="park-titel">overthinking<br /><em>everything</em></h1>
          <nav>
            <ul>
              <li><a href="index.html">Home</a></li>

          </nav>

        <div class="container">

          </a>
          <a href="music.html" class="blok2">
            <p>Music</p>
          </a>
          <a href="knop3.html" class="blok3">
            <p>Mindfulness</p>
          </a>
          <a href="knop4.html" class="blok4">
            <p>Activities</p>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
