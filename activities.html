<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Inger van der Sleen" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="A walk bingo card: tick off everything you spot on your walk and stop overthinking for a while."
    />

    <title>Inger's Junk Drawer — Activities</title>
    <link rel="stylesheet" href="./assets/style/style.css" />

    <!-- Importeer het webring component, voeg jouw eigen domein toe in data-page -->
    <script
      data-page="https://voorbeeld.nl"
      src="https://digitaaltuintje.nl/webring.js"
      defer
    ></script>
    <script src="./assets/script.js" defer></script>
  </head>

  <body>
    <a href="#main-content">Skip to main content</a>

    <header>
      <details>
        <summary>Color mode</summary>
        <form>
          <fieldset>
            <legend>Color mode</legend>
            <label>
              <input type="radio" name="color-scheme" value="auto" checked />
              auto
            </label>
            <label>
              <input type="radio" name="color-scheme" value="light" />
              light
            </label>
            <label>
              <input type="radio" name="color-scheme" value="dark" />
              dark
            </label>
          </fieldset>
        </form>
      </details>
    </header>

    <main id="main-content" tabindex="-1">
      <section>
        <header>
          <nav>
            <ul>
              <li><a href="beginjewandeling.html">Take a different path</a></li>
              <li><a href="index.html">Home</a></li>
            </ul>
          </nav>
          <p>inger's junk drawer</p>
          <h1>Activities</h1>
        </header>

        <p>
          Take this card with you on your next walk and tick off everything you
          spot. Turn your brain off and just look around.
        </p>

        <form>
          <fieldset>
            <legend>Walk bingo</legend>
            <ul>
              <li>
                <label>
                  <input type="checkbox" />
                  Spot a bird
                </label>
              </li>
              <li>
                <label>
                  <input type="checkbox" />
                  A red door
                </label>
              </li>
              <li>
                <label>
                  <input type="checkbox" />
                  Someone with a dog
                </label>
              </li>
              <li>
                <label>
                  <input type="checkbox" />
                  A bicycle
                </label>
              </li>
              <li>
                <label>
                  <input type="checkbox" checked disabled />
                  Free space: take a deep breath
                </label>
              </li>
              <li>
                <label>
                  <input type="checkbox" />
                  A flower
                </label>
              </li>
              <li>
                <label>
                  <input type="checkbox" />
                  A bench
                </label>
              </li>
              <li>
                <label>
                  <input type="checkbox" />
                  A cloud that looks like something
                </label>
              </li>
              <li>
                <label>
                  <input type="checkbox" />
                  Someone smiling
                </label>
              </li>
            </ul>
          </fieldset>

          <p role="status">Bingo! Great job. Keep going for the whole card.</p>

          <button type="reset">Start over</button>
        </form>
      </section>
    </main>
  </body>
</html>
